version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: gxfield-rainmaker_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/gxfield/rainmaker:0.4.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      HOME: /data/home
      # Derives the key that encrypts the GitHub token and secrets.
      APP_SEED: ${APP_SEED}
